<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higherjess Business | Digital Solutions</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Style Sheet Sheet Link -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- TAILWIND ENGINE CRITICAL DIRECTION -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF6B00',
                            navy: '#0A192F'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#0A1120] dark:text-gray-100 min-h-screen">

    <!-- GLOBAL NAVBAR -->
    <nav class="sticky top-0 bg-white/80 dark:bg-[#0C1527]/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800/80 w-full z-[100]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- Brand Logo Identity -->
                <div class="flex-shrink-0">
                    <a href="index.html" class="text-xl font-black uppercase tracking-tight text-brand-navy dark:text-white">
                        Higherjess<span class="text-brand-orange">.</span>
                    </a>
                </div>

                <!-- Desktop Navigation Links -->
                <div class="hidden md:flex items-center gap-8">
                    <a href="index.html" class="text-brand-orange font-semibold">Home</a>
                    <a href="pages/services.html" class="hover:text-brand-orange font-medium transition-colors">Services</a>
                    <!-- Price/Anchor links point directly to specific ID sections on home page layout -->
                    <a href="#services-preview" class="hover:text-brand-orange font-medium transition-colors">Prices</a>
                    
                    <!-- Desktop Theme Mode Engine Switch Trigger -->
                    <button id="theme-toggle" type="button" aria-label="Toggle dark mode desktop" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors focus:outline-none">
                        <i id="theme-toggle-dark-icon" class="fa-solid fa-moon text-lg"></i>
                        <i id="theme-toggle-light-icon" class="fa-solid fa-sun text-lg text-amber-500 hidden"></i>
                    </button>

                    <a href="pages/contact.html" class="bg-brand-orange hover:bg-orange-600 text-white font-medium px-4 py-2 rounded-lg transition-all shadow-sm">Contact Us</a>
                </div>

                <!-- Mobile Header Interactive Action Controls -->
                <div class="flex items-center gap-2 md:hidden">
                    <!-- Mobile Theme Engine Switch Trigger -->
                    <button id="mobile-theme-toggle" type="button" aria-label="Toggle dark mode mobile" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors focus:outline-none">
                        <i id="mobile-theme-toggle-icon" class="fa-solid fa-moon text-lg"></i>
                    </button>
                    <!-- Core Hamburger Drawer Layout Button Trigger -->
                    <button id="menu-btn" type="button" aria-label="Toggle navigation menu" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors focus:outline-none relative z-[110]">
                        <i class="fa-solid fa-bars text-xl pointer-events-none"></i>
                    </button>
                </div>

            </div>
        </div>

        <!-- MOBILE INTERACTIVE DRAWER CONTAINER (Controlled via js/script.js) -->
        <div id="mobile-menu" class="hidden md:hidden absolute top-16 left-0 w-full bg-white dark:bg-[#0C1527] border-b border-gray-200 dark:border-gray-800 shadow-xl z-[90]">
            <div class="px-4 pt-2 pb-6 space-y-2 flex flex-col">
                <a href="index.html" class="px-3 py-2 rounded-md bg-orange-500/10 text-brand-orange font-semibold">Home</a>
                <a href="pages/services.html" class="px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 font-medium transition-colors">Services</a>
                <a href="#services-preview" class="px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 font-medium transition-colors">Prices</a>
                <!-- Shop Link Integration -->
                <a href="https://higherjess.store" target="_blank" class="px-3 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 font-medium text-brand-orange transition-colors">Shop 🛍️</a>
                
                <hr class="border-gray-100 dark:border-gray-800 my-2">
                
                <a href="pages/contact.html" class="w-full text-center bg-brand-orange hover:bg-orange-600 text-white font-medium px-4 py-2.5 rounded-lg transition-all block">Contact Us</a>
            </div>
        </div>
    </nav>

    <!-- CORE CONTAINER SECTIONS GO BELOW HERE -->

    <!-- Core Script Binding -->
    <script src="js/script.js"></script>
</body>
</html>
